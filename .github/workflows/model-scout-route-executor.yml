name: MODEL SCOUT Route Executor

on:
  issues:
    types: [opened, reopened, edited, labeled]
  workflow_dispatch:
  push:
    branches:
      - "automation/model-scout-route-*"

permissions:
  contents: read
  issues: write

jobs:
  route-executor:
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge pending MODEL SCOUT routes
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- model-scout-route:ADAMBUILD-ai/mindle-model-scout#";
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const routes = issues.filter((issue) => !issue.pull_request && ((issue.body || "").includes(marker) || (issue.title || "").startsWith("[MODEL SCOUT ROUTE]")));
            core.notice("MODEL SCOUT route candidates: " + routes.map((issue) => issue.number).join(","));
            if (routes.length === 0) {
              core.notice("No pending MODEL SCOUT route issues found.");
              return;
            }
            const runUrl = "https://github.com/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId;
            for (const issue of routes) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100,
              });
              if (comments.some((comment) => (comment.body || "").includes("MODEL_SCOUT_ACK"))) {
                core.notice("Issue #" + issue.number + " already has ACK evidence.");
                continue;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: [
                  "## MODEL_SCOUT_ACK",
                  "- executor: GitHub Actions / MODEL SCOUT Route Executor",
                  "- route_state: ACK_RECEIVED",
                  "- execution_state: EXECUTING (input preflight)",
                  "- workflow_run: " + runUrl,
                  "- input_gate: BLOCKED_INPUT; runtime is not started without the exact source artifact required by this issue.",
                  "- next_gate: verify original files, manifest, provenance, sizes, and SHA-256 before Runtime → TESTED_PASS → Callback → DELIVERED.",
                ].join(String.fromCharCode(10)),
              });
            }
