name: MINDLE MEDIA AI verified product E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/product-e2e.yml"
      - "model_scout/run_product_e2e.py"
      - "model_scout/run_shortform_external_closeout.py"
      - "docs/commander/MINDLE_MEDIA_AI_SHORTFORM_EXTERNAL_INTEGRATION_CLOSEOUT*"
      - "CURRENT_PC_WORK_STATE.json"
      - "CURRENT_GENERAL_WORK_*.json"
      - "model_scout/run_general_work_audit.py"
      - "tests/test_general_work_gaps.py"
      - "model_scout/run_product_e2e_continuation.py"
      - "src/media_ai/browser_preview.py"
      - "pyproject.toml"
      - "tests/test_browser_preview.py"
      - "model_scout/stage_perpetual_use_alternatives.py"
      - "src/media_ai/product_runtime.py"
      - "src/media_ai/product_server.py"
      - "src/media_ai/verified_model_adapters.py"
      - "src/media_ai/realesrgan_verified_adapter.py"
      - "src/media_ai/intel_sisr_verified_adapter.py"
      - "ui/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mindle-media-product-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  active-epoch:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.epoch.outputs.base }}
      external: ${{ steps.epoch.outputs.external }}
      general: ${{ steps.epoch.outputs.general }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: epoch
        shell: python
        run: |
          import json, os
          from pathlib import Path
          epoch=json.loads(Path("CURRENT_PC_WORK_STATE.json").read_text())["control_plane_epoch"]
          general=json.loads(Path('CURRENT_GENERAL_WORK_STATE.json').read_text()) if Path('CURRENT_GENERAL_WORK_STATE.json').is_file() else {}
          with open(os.environ["GITHUB_OUTPUT"],"a") as output:
              output.write("base="+str(epoch=="MEDIA-AI-20261008-PRODUCT-E2E-VIDEO-PREVIEW-TO-FULL-PASS-R1").lower()+"\n")
              output.write("external="+str(epoch=="MEDIA-AI-20261008-SHORTFORM-EXTERNAL-INTEGRATION-CLOSEOUT-R1").lower()+"\n")
              output.write('general='+str(general.get('control_plane_epoch')=='MEDIA-AI-20261008-GENERAL-WORK-FINAL-SELF-AUDIT-R1' and general.get('status')=='ACTIVE_GENERAL_WORK_FINAL_SELF_AUDIT').lower()+'\n')
  general-work-final-self-audit:
    needs: active-epoch
    if: needs.active-epoch.outputs.general == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      MINDLE_DEFER_EXTERNAL_SHORTFORM: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit dependencies without models or package building
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          python -m pip install 'opencv-python-headless==4.12.0.88' 'numpy==2.2.6' 'Pillow==11.3.0' 'selenium==4.35.0' 'pytest>=9,<10' .
      - name: Restore frozen real product receipts without model rerun
        uses: actions/download-artifact@v4
        with:
          name: mindle-media-product-e2e-full-pass-evidence
          run-id: 37738880868
          github-token: ${{ github.token }}
          path: frozen_audit_checkpoint
      - name: Regression and active control validators
        run: |
          mkdir -p docs/evidence/media-ai-general-work-final-self-audit-20261008
          set -o pipefail
          { python scripts/validate_general_work_control_plane.py && python scripts/validate_pc_work_control_plane.py && python -m pip check && python -m compileall -q src model_scout/run_general_work_audit.py && python -m pytest -q && node --test ui/interaction.test.js ui/ssot_structure.test.js; } 2>&1 | tee docs/evidence/media-ai-general-work-final-self-audit-20261008/REGRESSION.log
      - name: Actual approved UI whole product audit
        run: python model_scout/run_general_work_audit.py
      - name: Preserve all runtime evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mindle-media-general-work-final-self-audit-evidence
          retention-days: 90
          if-no-files-found: error
          path: |
            docs/evidence/media-ai-general-work-final-self-audit-20261008/**
            general_work_audit_runtime/**
  external-shortform-closeout:
    needs: active-epoch
    if: needs.active-epoch.outputs.external == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify external epoch and actual runner configuration
        env:
          MARKETING_SHORTFORM_BASE_URL: ${{ vars.MARKETING_SHORTFORM_BASE_URL }}
          MARKETING_SHORTFORM_BRIDGE_TOKEN: ${{ secrets.MARKETING_SHORTFORM_BRIDGE_TOKEN }}
          MARKETING_SHORTFORM_HEALTH_PATH: ${{ vars.MARKETING_SHORTFORM_HEALTH_PATH }}
        run: python model_scout/run_shortform_external_closeout.py
      - name: Preserve external-only real runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mindle-media-shortform-external-closeout-evidence
          path: docs/evidence/media-ai-shortform-external-integration-closeout-20261008/**
          retention-days: 90
          if-no-files-found: error
  approved-ui-real-model-e2e:
    needs: active-epoch
    if: needs.active-epoch.outputs.base == 'true'
    name: Approved UI to perpetual-use CPU models
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_TOKEN: ${{ secrets.MINDLE_MEDIA_HF_WRITE_TOKEN }}
      MARKETING_SHORTFORM_BASE_URL: ${{ vars.MARKETING_SHORTFORM_BASE_URL || 'http://127.0.0.1:4318' }}
      MARKETING_SHORTFORM_BRIDGE_TOKEN: ${{ secrets.MARKETING_SHORTFORM_BRIDGE_TOKEN }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_XET: "1"
      CUDA_VISIBLE_DEVICES: ""
      PYTHONPATH: src
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Enforce no-cost CPU-only boundary
        shell: bash
        run: |
          if [ "${{ github.event.repository.private }}" != "false" ]; then
            echo "::error::Only a public repository free hosted runner is authorized"
            exit 1
          fi
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::MINDLE_MEDIA_HF_WRITE_TOKEN is unavailable"
            exit 1
          fi
          echo "::add-mask::$HF_TOKEN"
          if command -v nvidia-smi >/dev/null 2>&1; then
            echo "::error::GPU tooling is present; refusing execution"
            exit 1
          fi
      - name: Install pinned CPU runtime and browser driver
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          python -m pip install --disable-pip-version-check "torch==2.8.0" "torchvision==0.23.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check "transformers==4.57.3" "huggingface_hub==0.36.0" "safetensors==0.6.2" "opencv-python-headless==4.12.0.88" "onnxruntime==1.30.0" "numpy==2.2.6" "Pillow==11.3.0" "pyarrow==21.0.0" "soundfile==0.13.1" "jiwer==4.0.0" "requests==2.32.5" "selenium==4.35.0" "openvino==2025.3.0"
      - name: Restore immutable PHOTO and tracking checkpoint without model rerun
        uses: actions/download-artifact@v4
        with:
          name: mindle-media-approved-ui-product-e2e-evidence
          run-id: 37735046818
          github-token: ${{ github.token }}
          path: frozen_product_checkpoint
      - name: Verify active epoch and baseline
        shell: bash
        run: |
          mkdir -p docs/evidence/media-ai-product-e2e-full-pass-20261008
          python -m pip install "pytest>=9,<10"
          python -m pip install --no-deps --force-reinstall .
          python -m pip check
          set -o pipefail
          { python scripts/validate_pc_work_control_plane.py && python -m pytest -q && node --test ui/interaction.test.js ui/ssot_structure.test.js; } 2>&1 | tee docs/evidence/media-ai-product-e2e-full-pass-20261008/BASELINE_CI_PASS.log
      - name: Directly acquire and stage perpetual-use alternatives
        run: python model_scout/stage_perpetual_use_alternatives.py
      - name: Continue VIDEO diagnosis playback STT reopen export and live integration
        run: python model_scout/run_product_e2e_continuation.py
      - name: Validate full product runtime PASS
        shell: python
        run: |
          import json
          from pathlib import Path
          evidence = json.loads(Path("docs/evidence/media-ai-product-e2e-full-pass-20261008/EVIDENCE.json").read_text())
          assert evidence["status"] == "PASS_MINDLE_MEDIA_AI_FULL_PRODUCT_E2E_RUNTIME_VERIFIED"
          assert evidence["full_product_pass"] is True
          assert evidence["PHOTO_MODELS_RERUN"] is False
          assert evidence["UI_SSOT_CHANGED"] == "NO"
          assert evidence["main_changed"] is False
          assert evidence["employee_package_rebuilt"] is False
      - name: Preserve actual inputs outputs logs screenshot and Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mindle-media-product-e2e-full-pass-evidence
          retention-days: 90
          if-no-files-found: warn
          path: |
            docs/evidence/media-ai-product-e2e-full-pass-20261008/**
            product_e2e_evidence/downloads/**
            product_e2e_evidence/inputs/**
            product_e2e_evidence/product_data/inputs/**
            product_e2e_evidence/product_data/jobs/**
            product_e2e_evidence/product_data/projects/**
            product_e2e_evidence/logs/**
            product_e2e_evidence/PRODUCT_E2E_EVIDENCE.json

