name: R9 project dependency export regression
on:
  push:
    branches: [feature/ad-shortform-bridge-p0-20260926]
    paths:
      - .github/workflows/r9-export-dependencies.yml
      - tests/test_export_project_dependencies.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install pytest==8.4.2 Pillow==11.3.0 huggingface-hub==0.35.3 opencv-python-headless==4.12.0.88
      - name: Verify dependency bytes, interrupted writes and cold reopen
        run: python -m pytest -q tests/test_export_project_dependencies.py tests/test_export_atomicity.py tests/test_photo_edit_project.py tests/test_runtime_recovery.py
      - run: python scripts/run_source_http_cold_restart_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r9-project-dependency-export
          path: outputs/r9-source-regression
          retention-days: 14
