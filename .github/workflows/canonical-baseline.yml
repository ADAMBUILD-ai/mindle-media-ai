name: Canonical baseline

on:
  pull_request:
  push:
    branches:
      - work/**

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q
      - run: python model_scout/validate_evidence_sync.py
      - run: node --test ui/interaction.test.js ui/ssot_structure.test.js
      - run: python model_scout/validate_package_manifest.py --source
