name: Windows media codec comparison
on:
  push:
    branches: [feature/ad-shortform-bridge-p0-20260926]
    paths: [.github/workflows/windows-media-codec-probe.yml, scripts/windows_media_codec_probe.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-codec-comparison:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install chromium
      - name: Fetch immutable tested LGPL FFmpeg archive
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-12-13-12/ffmpeg-n8.1.3-18-g46d899d7a0-win64-lgpl-shared-8.1.zip" -OutFile codec_ffmpeg.zip
          if ((Get-FileHash codec_ffmpeg.zip -Algorithm SHA256).Hash.ToLower() -ne "fa628b9de20254fe7c80605a4c6af54d0bffdda0807363ee7557131c2b78e051") {throw "FFmpeg hash mismatch"}
          Expand-Archive codec_ffmpeg.zip codec_probe_ffmpeg
      - name: Compare same source and MF encoder against actual browsers
        run: python scripts/windows_media_codec_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mindle-windows-media-codec-comparison-20261014
          path: codec_probe_evidence/**
          retention-days: 90
