name: R9 Windows source browser and cold restart
on:
  push:
    branches: [feature/ad-shortform-bridge-p0-20260926]
    paths:
      - .github/workflows/r9-windows-source-closeout.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-source:
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Acquire existing hash-pinned CI-only media fixture tool
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/r9-media" | Out-Null
          $archive = "$env:RUNNER_TEMP/r9-media/ffmpeg.zip"
          Invoke-WebRequest -TimeoutSec 120 -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-12-13-12/ffmpeg-n8.1.3-18-g46d899d7a0-win64-gpl-shared-8.1.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne '7bad9c116b45fb7441c636d2dc8c15d40cd2933772c6920d60569bb184c8c524') { throw 'CI fixture tool identity mismatch' }
          Expand-Archive $archive "$env:RUNNER_TEMP/r9-media/unpacked"
          $binary = Get-ChildItem "$env:RUNNER_TEMP/r9-media/unpacked" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $binary) { throw 'CI fixture tool missing' }
          $binary.Directory.FullName | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          # CI fixtures only. No package payload, final release or production tool is built/changed.
      - run: python -m pip install pytest==8.4.2 Pillow==11.3.0 huggingface-hub==0.35.3 opencv-python-headless==4.12.0.88 playwright==1.55.0
      - name: Windows input reference atomic Export persistence regression
        run: python -m pytest -q tests/test_export_project_dependencies.py tests/test_export_atomicity.py tests/test_photo_edit_project.py tests/test_runtime_recovery.py
      - name: Real Windows server restart and official Chrome source UI
        run: python scripts/run_source_http_cold_restart_check.py --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r9-windows-source-browser-closeout
          path: outputs/r9-source-regression
          retention-days: 14
