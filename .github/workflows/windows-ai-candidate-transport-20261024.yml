name: Byte identical bounded candidate transport 20261024
on:
  push:
    branches: [feature/ad-shortform-bridge-p0-20260926]
    paths: [.github/workflows/windows-ai-candidate-transport-20261024.yml]
permissions:
  contents: read
  actions: read
