name: Workspace attachments source browser regression
on:
  push:
    branches: [feature/ad-shortform-bridge-p0-20260926]
    paths: [.github/workflows/workspace-assets-regression.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-workspace:
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: product/src
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: product
      - uses: actions/checkout@v4
        with:
          ref: 55003e0d2d8cf2d4f79411064bf96b644656f510
          path: baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.4.2 Pillow==11.3.0 huggingface-hub==0.35.3 opencv-python-headless==4.12.0.88 playwright==1.55.0
      - name: Acquire existing hash-pinned CI-only media fixture tool
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/workspace-media" | Out-Null
          $archive = "$env:RUNNER_TEMP/workspace-media/ffmpeg.zip"
          Invoke-WebRequest -TimeoutSec 120 -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-12-13-12/ffmpeg-n8.1.3-18-g46d899d7a0-win64-gpl-shared-8.1.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne '7bad9c116b45fb7441c636d2dc8c15d40cd2933772c6920d60569bb184c8c524') { throw 'CI fixture tool identity mismatch' }
          Expand-Archive $archive "$env:RUNNER_TEMP/workspace-media/unpacked"
          $binary = Get-ChildItem "$env:RUNNER_TEMP/workspace-media/unpacked" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $binary) { throw 'CI fixture tool missing' }
          $binary.Directory.FullName | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          # CI fixtures only. No package payload, final release or production tool is built/changed.
      - name: Verify attachment persistence and affected Export paths
        run: python -m pytest -q product/tests/test_workspace_assets.py product/tests/test_export_atomicity.py product/tests/test_export_project_dependencies.py product/tests/test_photo_edit_project.py product/tests/test_runtime_recovery.py
      - name: Preserve existing UI behavior contracts
        run: node --test product/ui/interaction.test.js product/ui/ssot_structure.test.js product/ui/cloud_navigation.test.js
      - name: Reproduce actual baseline attachment loss through Save cold reopen
        run: python product/scripts/check_workspace_asset_persistence.py --root baseline --out outputs/workspace-assets/baseline --expect-loss
      - name: Verify repaired actual browser Save cold reopen and UI Export
        run: python product/scripts/check_workspace_asset_persistence.py --root product --out outputs/workspace-assets/repaired
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-assets-browser-before-after
          path: outputs/workspace-assets
          retention-days: 30
